[package]
name = "sudoku-generator"
version = "0.1.0"
edition = "2021"
description = "Generate difficult, uniquely solvable Sudoku puzzles for language-model datasets"
license = "MIT"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
rayon = "1.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
